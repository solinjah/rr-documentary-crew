[project]
name = "rr-documentary-crew"
version = "0.2.0"
description = "Riddles & Realms documentary crew: research, public-domain images and first-draft scripts, using the Anthropic API."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
rr-crew = "rr_crew.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rr_crew"]
